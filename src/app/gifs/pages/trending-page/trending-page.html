<!--overflow-y-scroll-->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 h-screen overflow-y-scroll no-scrollbar  " (scroll)="onScroll($event)"
    #groupDiv>

    @for (groups of gifService.treadingGroup(); track $index) {
    <div class="grid gap-5" #groupDiv>
        @for (gif of groups; track gif.id) {
        <div class="overflow-hidden rounded-xl cursor-pointer shadow-sm ">
            <img class="w-full h-full object-cover hover:scale-105  rounded-base" [src]="gif.url" [alt]="gif.title">
        </div>

        }
    </div>


    }

</div>
